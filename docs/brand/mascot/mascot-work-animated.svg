  <style>
    .halo, .lamp { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .halo { animation: pulse 2s ease-in-out infinite; }
      .lamp-left { animation: blink 2.4s ease-in-out infinite; }
      .lamp-right { animation: blink 2.4s ease-in-out 1.2s infinite; }
    }
    @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  </style>
