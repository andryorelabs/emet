<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>emet cover</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 440px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        display: grid;
        grid-template-columns: 1fr 300px;
        align-items: center;
        gap: 48px;
        padding: 48px 88px;
        border-bottom: 8px solid var(--accent);
      }
      .logo {
        height: 64px;
        width: auto;
        display: block;
      }
      h1 {
        font-size: 52px;
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 700;
        margin-top: 32px;
      }
      h1 span {
        color: var(--accent-text);
      }
      p {
        font-size: 22px;
        color: var(--text-muted);
        margin-top: 20px;
        max-width: 640px;
        line-height: 1.4;
      }
      code {
        font-family: var(--font-mono);
        font-size: 18px;
        color: var(--text-muted);
        display: block;
        margin-top: 24px;
      }
      .mascot {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="../logo/lockup-horizontal-dark.svg" alt="emet" />
      <h1>Spec to merge,<br /><span>on one approval.</span></h1>
      <p>
        A plugin for Claude Code and Codex. Parallel workers in isolated worktrees, a review per
        wave, CI green before merge.
      </p>
      <code>Not affiliated with or endorsed by Anthropic</code>
    </main>
    <img class="mascot" src="../mascot/mascot-work.svg" alt="emet mascot" />
  </body>
</html>
