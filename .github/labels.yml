# Synced by .github/workflows/labels.yml. The sync never deletes labels missing from this file.

# ── emet triage labels ──

- name: "needs-triage"
  color: "ededed"
  description: "Maintainer has not evaluated this yet"

- name: "needs-info"
  color: "d876e3"
  description: "Waiting for more information from the reporter"

- name: "ready-for-agent"
  color: "0e8a16"
  description: "Fully specified, ready for an AI agent to pick up"

- name: "ready-for-human"
  color: "1d76db"
  description: "Needs human implementation"

- name: "wontfix"
  color: "cfd3d7"
  description: "Will not be worked on"

# ── emet state labels ──

- name: "status:todo"
  color: "c5def5"
  description: "Ticket is queued for work"

- name: "status:in-progress"
  color: "fbca04"
  description: "Ticket is being worked on"

- name: "status:in-review"
  color: "5319e7"
  description: "Ticket has an open pull request"

# ── Type ──

- name: "Type: Bug"
  color: "d73a4a"
  description: "Something isn't working correctly"

- name: "Type: Feature"
  color: "a2eeef"
  description: "A brand-new feature or capability"

- name: "Type: Enhancement"
  color: "54aeff"
  description: "Improvement to an existing feature"

- name: "Type: Docs"
  color: "0052cc"
  description: "Documentation additions, corrections, or improvements"

- name: "Type: Security"
  color: "b60205"
  description: "Security vulnerability or hardening"

# ── Status ──

- name: "Status: Needs Info"
  color: "d876e3"
  description: "Waiting for more information"

- name: "Status: Needs Decision"
  color: "fef2c0"
  description: "Waiting for a maintainer decision"

- name: "Status: Blocked"
  color: "e11d21"
  description: "Blocked by another issue or external factor"

- name: "Status: In Progress"
  color: "fbca04"
  description: "Work is underway"

# ── Priority ──

- name: "Priority: Critical"
  color: "b60205"
  description: "Drop everything"

- name: "Priority: High"
  color: "d93f0b"
  description: "Do next"

- name: "Priority: Medium"
  color: "fbca04"
  description: "Do soon"

- name: "Priority: Low"
  color: "0e8a16"
  description: "Do when convenient"

# ── Resolution ──

- name: "Resolution: Duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "Resolution: Won't Fix"
  color: "cfd3d7"
  description: "Deliberately not going to be worked on"

- name: "Resolution: Invalid"
  color: "cfd3d7"
  description: "Not a valid issue"

# ── Area ──

- name: "Area: CLI"
  color: "bfdadc"
  description: "The emet CLI"

- name: "Area: Guard"
  color: "bfdadc"
  description: "Guard hooks and edit guard"

- name: "Area: Plugin"
  color: "bfdadc"
  description: "The Claude Code plugin, commands and agents"

- name: "Area: Codex"
  color: "bfdadc"
  description: "The Codex plugin"

- name: "Area: Site"
  color: "bfdadc"
  description: "The Website"

- name: "Area: Docs"
  color: "bfdadc"
  description: "Documentation, ADRs and guides"

- name: "Area: Tooling"
  color: "bfdadc"
  description: "Dev tooling, lint and tests"

- name: "Area: CI"
  color: "bfdadc"
  description: "CI workflows and releases"

# ── Other ──

- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"

- name: "github-actions"
  color: "2088ff"
  description: "GitHub Actions workflow changes"

- name: "security"
  color: "b60205"
  description: "Security vulnerability or hardening"

- name: "breaking-change"
  color: "b60205"
  description: "Changes behavior in a backwards-incompatible way"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
