name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: forge

jobs:
  test:
    runs-on:
      ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit -p tsconfig.json

      - run: bun test
