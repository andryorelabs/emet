name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Check the tag matches plugin.json
        run: |
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ "${GITHUB_REF_NAME}" != "v${plugin_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version v${plugin_version}"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - run: bun install --frozen-lockfile

      - run: bun install --cwd forge --frozen-lockfile

      - name: Build the standalone binaries
        run: bun tools/build-binaries.ts --outdir dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum forge-linux-x64 forge-linux-arm64 forge-darwin-x64 forge-darwin-arm64 > SHA256SUMS

      - name: Extract changelog section
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="${tag_version}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for version ${tag_version}"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/forge-linux-x64 \
            dist/forge-linux-arm64 \
            dist/forge-darwin-x64 \
            dist/forge-darwin-arm64 \
            dist/SHA256SUMS
