name: Lint Docs

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    name: Check markdown links
    runs-on: ${{ github.event.repository.private && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --offline: check only local files and in-repo anchors, never the network,
          #   so the job is deterministic and cannot flake on third-party sites.
          # --include-fragments=anchor-only: also verify #heading anchors, but only
          #   fragments of local markdown targets (no HTTP fragment fetching).
          # --no-progress: keep CI logs free of the progress bar.
          # fail: true makes any broken link fail the job.
          args: >-
            --offline --include-fragments=anchor-only --no-progress '*.md'
            'docs/**/*.md' 'emet/**/*.md' '.github/**/*.md' 'commands/*.md'
            'agents/*.md'
          fail: true
