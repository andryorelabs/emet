name: Documentation Bug
description: Report missing, incorrect, or unclear documentation
title: 'docs: '
labels: ['documentation', 'needs-triage']

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: File path, section, or link to the affected documentation.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the inaccuracy, gap, or confusing passage.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you have wording or a correction in mind, share it here.
