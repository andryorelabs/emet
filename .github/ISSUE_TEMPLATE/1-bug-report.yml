name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "fix: "
labels: ["bug", "needs-triage"]

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps or commands to reproduce the behavior.
      value: |
        1. Run '...'
        2. See error
    validations:
      required: true

  - type: dropdown
    id: agent-host
    attributes:
      label: Agent host
      description: Which Agent host were you running emet on?
      options:
        - Claude Code
        - Codex
    validations:
      required: true

  - type: input
    id: host-cli-version
    attributes:
      label: Host CLI version
      description: Output of `claude --version` or `codex --version`.
      placeholder: "2.1.0 or 0.167.0"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, bun version, and emet version or commit SHA.
      placeholder: |
        - OS: Ubuntu 24.04
        - bun: 1.3.0
        - emet: 0.1.0

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, related issues, or anything else that helps.
