worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
  }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/markdown text/css text/xml application/xml application/json application/javascript image/svg+xml;
  charset utf-8;
  charset_types text/plain text/markdown text/xml application/xml text/css application/javascript application/json;
  resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
  resolver_timeout 5s;
  proxy_cache_path /tmp/github-stars-cache levels=1 keys_zone=github_stars:1m max_size=1m inactive=1d use_temp_path=off;
  include /etc/nginx/conf.d/*.conf;
}
